<style>
:root{--bg:#fbfaf7;--fg:#1b1a17;--mut:#5f5a52;--line:#e6e1d7;--acc:#b8400b;--card:#fff;color-scheme:light}

.meta{font-size:.9rem;color:var(--mut);margin:0 0 4px}.meta b{color:var(--acc);font-weight:700;text-transform:uppercase;font-size:.82rem;letter-spacing:.08em}

.org.nl{color:#1d5c8c;background:#eaf2f9;border-color:#cfe0ee}.org.bu{color:#5b5143;background:#f2efe8;border-color:#e2dccf}
:root[data-theme=dark] .org.nl{color:#9cc8ec;background:#16222d;border-color:#26394a}:root[data-theme=dark] .org.bu{color:#cfc6b6;background:#22211e;border-color:#36342f}
.org svg{flex:0 0 auto}
.of{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}.of button{flex:1 1 auto;min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:.92rem;font-weight:600;white-space:nowrap}
.of button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}.of span{opacity:.7;font-weight:500;margin-left:4px}
.ofl{font-size:.82rem;color:var(--mut);margin:12px 0 0;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
[hidden]{display:none!important}
footer{color:var(--mut);font-size:.9rem;padding:32px 0}footer a{display:inline-flex;min-height:44px;align-items:center}

.bar.on{transform:none}.bar span{flex:1;max-width:520px;font-weight:600}
.bar button{min-height:44px;padding:0 18px;border-radius:22px;border:0;background:var(--acc);color:#fff;font-weight:700}.bar .gh{background:transparent;color:var(--bg);border:1px solid currentColor}

.home{max-width:680px;margin:0 auto;padding:0 22px 60px}.cta{display:flex;min-height:56px;align-items:center;justify-content:center;background:var(--acc);color:#fff;font-weight:700;text-decoration:none;border-radius:28px;margin:20px 0 8px}ul{list-style:none;padding:0;margin:0}li a{display:flex;min-height:52px;align-items:center;border-bottom:1px solid var(--line);text-decoration:none;font-size:1.1rem}</style></head>
